# Databricks Asset Bundle configuration
# Docs: https://docs.databricks.com/dev-tools/bundles/index.html
bundle:
  name: airline-medallion

include:
  - workflows/*.yml

# Reusable variables
variables:
  catalog:
    description: Unity Catalog to use for tables (Free Edition uses "workspace")
    default: workspace
  schema:
    description: Schema/database for the project tables
    default: airline_medallion
  volume:
    description: Volume name for the landing zone
    default: landing

targets:
  # Free Edition serverless workspace.
  dev:
    mode: development
    default: true
    workspace:
      # Replace with your Databricks Free Edition workspace URL
      host: https://dbc-00000000-0000.cloud.databricks.com
