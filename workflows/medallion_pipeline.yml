# Databricks Job definition - orchestrates the medallion pipeline.
# Referenced by databricks.yml via the include directive.
resources:
  jobs:
    medallion_pipeline:
      name: airline-medallion-pipeline
      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../notebooks/bronze/ingest_landing.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../notebooks/silver/transform_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: gold_aggregate
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ../notebooks/gold/aggregate_gold.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
